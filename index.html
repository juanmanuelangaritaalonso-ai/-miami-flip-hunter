<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>Miami Flip Hunter</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:#f4f5f7;margin:0;color:#111827}
header{background:#111827;color:white;padding:20px 16px 18px;position:sticky;top:0;z-index:3}
h1{margin:0;font-size:24px}.sub{opacity:.75;font-size:13px;margin-top:4px}
main{padding:14px;max-width:760px;margin:auto}.panel{background:white;border-radius:16px;padding:14px;box-shadow:0 2px 10px #0000000d;margin-bottom:12px}
input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:11px;border:1px solid #d1d5db;font-size:16px;margin-top:8px}
button{background:#111827;color:#fff;border:0;font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:white;border-radius:16px;padding:15px;margin:10px 0;box-shadow:0 2px 10px #0000000b}
.score{font-size:22px;font-weight:800}.buy{font-weight:800}.meta{font-size:13px;color:#6b7280;margin:4px 0}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:10px 0}.stat{background:#f3f4f6;padding:8px;border-radius:9px;font-size:12px}.stat b{display:block;font-size:15px}
a{color:#2563eb;text-decoration:none;font-weight:700}.small{font-size:12px;color:#6b7280}
</style></head><body>
<header><h1>Miami Flip Hunter</h1><div class="sub">Deal scanner • Miami • BUY / CHECK / PASS</div></header>
<main>
<div class="panel">
<input id="q" placeholder="What are you looking for? e.g. Sony a6400, PS5, MacBook">
<div class="row"><input id="max" type="number" value="1000" placeholder="Max buy $"><input id="minp" type="number" value="75" placeholder="Min profit $"></div>
<button onclick="scan()">SCAN MIAMI</button>
<div id="status" class="small"></div></div>
<div id="results"></div>
</main>
<script>
async function scan(){
 const s=document.getElementById('status'); const r=document.getElementById('results');
 s.textContent='Scanning…'; r.innerHTML='';
 try{
  const x=await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({query:document.getElementById('q').value||'cameras',max_buy:document.getElementById('max').value,min_profit:document.getElementById('minp').value})});
  const d=await x.json(); s.textContent=d.errors?.length?d.errors.join(' | '):`${d.listings.length} opportunities found`;
  d.listings.forEach(i=>r.insertAdjacentHTML('beforeend',`
   <div class="card"><div class="score">${i.score}/100 <span class="buy">${i.verdict}</span></div>
   <h3>${esc(i.title)}</h3><div class="meta">Listed: $${i.price.toLocaleString()} • Est. resale: $${i.estimated_resale.toLocaleString()}</div>
   <div class="stats"><div class="stat"><b>$${i.estimated_profit}</b>Profit</div><div class="stat"><b>${i.margin_pct}%</b>Margin</div><div class="stat"><b>$${i.max_buy}</b>Max offer</div></div>
   <div class="small">${esc(i.reason)}</div><p><a href="${i.url}" target="_blank" rel="noopener">VIEW LISTING →</a></p></div>`));
 }catch(e){s.textContent='Error: '+e.message}
}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
</script></body></html>
