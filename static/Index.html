<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Miami Flip Hunter</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6f8;color:#111}
    .wrap{max-width:900px;margin:auto;padding:18px}
    h1{margin:0 0 4px;font-size:28px}
    .sub{color:#666;margin-bottom:18px}
    .panel{background:white;border-radius:16px;padding:16px;box-shadow:0 2px 10px #00000012;margin-bottom:16px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    label{font-size:13px;color:#555;display:block;margin-bottom:5px}
    input,select,button{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;font-size:15px}
    button{background:#111;color:white;border:0;font-weight:700;cursor:pointer}
    .full{grid-column:1/-1}
    .card{background:white;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px #00000012}
    .top{display:flex;justify-content:space-between;gap:10px}
    .title{font-weight:700;font-size:17px}
    .price{font-size:21px;font-weight:800;white-space:nowrap}
    .meta{color:#666;font-size:13px;margin-top:5px}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:13px 0}
    .stat{background:#f5f5f5;border-radius:10px;padding:8px}
    .stat b{display:block;font-size:14px}
    .stat span{font-size:11px;color:#666}
    .badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}
    .buy{background:#dff7e5;color:#126b2b}
    .check{background:#fff1c7;color:#765800}
    .pass{background:#ffdede;color:#8a2020}
    a{color:#1264d8;text-decoration:none;font-weight:600}
    @media(max-width:600px){
      .grid{grid-template-columns:1fr}
      .full{grid-column:auto}
      .stats{grid-template-columns:repeat(2,1fr)}
    }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Miami Flip Hunter</h1>
  <div class="sub">Find underpriced resale opportunities in Miami</div>

  <div class="panel">
    <div class="grid">
      <div class="full">
        <label>What are you looking for?</label>
        <input id="query" placeholder="Sony camera, iPhone, PS5, MacBook...">
      </div>

      <div>
        <label>Max buy price</label>
        <input id="maxBuy" type="number" value="500">
      </div>

      <div>
        <label>Minimum profit</label>
        <input id="minProfit" type="number" value="100">
      </div>

      <div>
        <label>Marketplace</label>
        <select id="marketplace">
          <option value="all">All</option>
          <option value="facebook">Facebook Marketplace</option>
          <option value="offerup">OfferUp</option>
        </select>
      </div>

      <div class="full">
        <button onclick="scan()">SCAN MIAMI</button>
      </div>
    </div>
  </div>

  <div id="status"></div>
  <div id="results"></div>
</div>

<script>
async function scan(){
  const query=document.getElementById("query").value.trim();
  const maxBuy=document.getElementById("maxBuy").value;
  const minProfit=document.getElementById("minProfit").value;
  const marketplace=document.getElementById("marketplace").value;

  if(!query){
    document.getElementById("status").innerHTML=
      '<div class="panel">Enter a product to search.</div>';
    return;
  }

  document.getElementById("status").innerHTML=
    '<div class="panel">🔎 Searching Miami listings...</div>';
  document.getElementById("results").innerHTML="";

  try{
    const params=new URLSearchParams({
      query,
      max_buy:maxBuy,
      min_profit:minProfit,
      marketplace
    });

    const response=await fetch("/api/scan?"+params.toString());
    const data=await response.json();

    if(!response.ok) throw new Error(data.error || "Search failed");

    document.getElementById("status").innerHTML=
      '<div class="panel">Found '+data.length+' opportunities.</div>';

    renderResults(data);
  }catch(error){
    document.getElementById("status").innerHTML=
      '<div class="panel">❌ '+error.message+'</div>';
  }
}

function renderResults(items){
  const container=document.getElementById("results");

  if(!items.length){
    container.innerHTML='<div class="panel">No good opportunities found.</div>';
    return;
  }

  container.innerHTML=items.map(item=>{
    const cls=item.decision==="BUY"?"buy":
              item.decision==="CHECK"?"check":"pass";

    return `
      <div class="card">
        <div class="top">
          <div>
            <div class="title">${escapeHtml(item.title || "Listing")}</div>
            <div class="meta">${escapeHtml(item.source || "")}</div>
          </div>
          <div class="price">$${Number(item.price||0).toFixed(0)}</div>
        </div>

        <div class="stats">
          <div class="stat">
            <b>${item.score ?? "-"}/100</b>
            <span>Score</span>
          </div>
          <div class="stat">
            <b>$${Number(item.resale||0).toFixed(0)}</b>
            <span>Resale</span>
          </div>
          <div class="stat">
            <b>$${Number(item.profit||0).toFixed(0)}</b>
            <span>Profit</span>
          </div>
          <div class="stat">
            <b>${Number(item.margin||0).toFixed(0)}%</b>
            <span>Margin</span>
          </div>
        </div>

        <div>
          <span class="badge ${cls}">${item.decision || "CHECK"}</span>
        </div>

        <div class="meta" style="margin-top:10px">
          Demand: ${escapeHtml(item.demand || "Unknown")} ·
          Sell speed: ${escapeHtml(item.sell_speed || "Unknown")} ·
          Risk: ${escapeHtml(item.risk || "Unknown")}
        </div>

        <div style="margin-top:12px">
          <a href="${escapeAttr(item.url || "#")}" target="_blank" rel="noopener">
            View listing →
          </a>
        </div>
      </div>
    `;
  }).join("");
}

function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function escapeAttr(value){
  return String(value).replaceAll('"',"&quot;");
}
</script>
</body>
</html>
